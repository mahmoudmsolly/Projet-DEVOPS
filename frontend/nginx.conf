server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the Spring Boot container (service name on the Docker network)
    location /api/ {
        proxy_pass http://springapp:8080/;
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
